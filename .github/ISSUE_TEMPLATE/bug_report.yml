name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove names, phone numbers and private chats from screenshots and logs."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "e.g. 1.0.12 (bottom of the Settings page)"
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "e.g. Pixel 8, Android 15"
  - type: textarea
    id: log
    attributes:
      label: Engine log (optional)
      description: Settings → Devices → Engine log. Check it for personal data first.
      render: text
