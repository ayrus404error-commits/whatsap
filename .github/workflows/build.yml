# Builds the Whatsap APK on GitHub's servers.
#
# - Every push and pull request: builds and tests, APK attached to the run
#   (Actions → the run → Artifacts).
# - Pushing a tag like v1.2.0: also publishes a GitHub Release with the APK.
#
# Signing: add these repository secrets (Settings → Secrets and variables →
# Actions) to sign with your own key. Without them the APK is signed with a
# throwaway debug key, which installs fine but can't update a release build.
#   GLASSCHAT_KEYSTORE_BASE64   base64 of your .jks file
#   GLASSCHAT_KEYSTORE_PASSWORD
#   GLASSCHAT_KEY_ALIAS
#   GLASSCHAT_KEY_PASSWORD
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
      WHATSMEOW_REV: d24d079a3755f0975d37a1b15fc204758a995c18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - name: Install Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build WhatsApp engine (Go → Android library)
        working-directory: bridge
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          {
            set -e
            # The committed go.mod points at offline copies (used for sandbox
            # builds). Here everything is resolved fresh from the public proxy.
            rm -f go.mod go.sum
            go mod init glasschat/bridge
            go get "go.mau.fi/whatsmeow@$WHATSMEOW_REV"
            go mod tidy
            # Pinned: newer x/mobile releases can raise x/crypto/x/net and break the build.
            go get golang.org/x/mobile/bind@v0.0.0-20261011034528-197770444867
            XMOBILE="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
            echo "x/mobile $XMOBILE"
            go install "golang.org/x/mobile/cmd/gomobile@$XMOBILE" "golang.org/x/mobile/cmd/gobind@$XMOBILE"
            go test -count=1 .
            mkdir -p ../android/app/libs
            gomobile bind -target=android/arm64 -androidapi 29 -javapkg com.glasschat.go -ldflags="-s -w" -o ../android/app/libs/wa.aar .
            ls -la ../android/app/libs/
          } 2>&1 | tee ../engine.log

      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.GLASSCHAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GLASSCHAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GLASSCHAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GLASSCHAT_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "GLASSCHAT_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "GLASSCHAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "GLASSCHAT_KEY_ALIAS=$KEY_ALIAS"
              echo "GLASSCHAT_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "No signing secrets: using a debug key."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace --warning-mode=none 2>&1 | tee ../build.log

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Whatsap-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Whatsap-apk-${{ github.run_number }}
          path: Whatsap-*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "Whatsap-${{ github.run_number }}.apk" "Whatsap-${{ github.ref_name }}.apk"
          # Release made on the website first? Just attach the APK to it.
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "Whatsap-${{ github.ref_name }}.apk" --repo "${{ github.repository }}" --clobber
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
          else
            gh release create "${{ github.ref_name }}" "Whatsap-${{ github.ref_name }}.apk" \
              --repo "${{ github.repository }}" \
              --title "Whatsap ${{ github.ref_name }}" \
              --generate-notes
          fi

      # On failure: put the errors at the top of the run's Summary page, ready
      # to copy, and keep the full logs as a downloadable "build-logs" file.
      - name: Summarise errors
        if: failure()
        run: |
          touch engine.log build.log
          {
            grep -hE "^e: |^ERROR|error:|undefined:|cannot use|panic:|--- FAIL|^FAIL" engine.log build.log || true
            grep -h -A12 "What went wrong" build.log || true
          } | head -250 > errors.txt
          [ -s errors.txt ] || tail -n 80 engine.log build.log > errors.txt
          {
            echo "## ❌ Build failed"
            echo '```'
            cat errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            errors.txt
            engine.log
            build.log
